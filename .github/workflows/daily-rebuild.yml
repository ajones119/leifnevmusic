name: Rebuild upcoming shows
on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    if: vars.RENDER_REBUILD_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Request a Render rebuild
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo 'RENDER_DEPLOY_HOOK is not configured.' >&2
            exit 1
          fi
          case "$RENDER_DEPLOY_HOOK" in
            https://api.render.com/deploy/*) ;;
            *) echo 'Deploy hook must be a Render HTTPS deploy endpoint.' >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --output /dev/null --request POST "$RENDER_DEPLOY_HOOK"
