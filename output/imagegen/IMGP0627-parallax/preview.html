<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMGP0627 · Parallax draft</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171d19;color:#f0eee6;font:16px/1.5 system-ui,sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px)}h1{font-size:20px;font-weight:500;margin:0 0 16px}.scene{position:relative;width:100%;aspect-ratio:1026/1533;overflow:hidden;background:#73905d;border-radius:4px}.scene img{position:absolute;display:block;pointer-events:none;user-select:none}.foliage,.porch{inset:-3%;width:106%;height:106%;object-fit:fill}.musician{left:15%;top:19%;width:69%;height:69%;object-fit:fill}button{margin-top:16px;padding:10px 16px;background:#eee9dc;color:#172019;border:0;border-radius:4px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e3be73;outline-offset:4px}p{font-size:13px;color:#c0c7bb;margin:12px 0}a{color:inherit}
.scene{
  border-radius:50%;
  -webkit-mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 92%,transparent 100%);
  mask-image:radial-gradient(ellipse closest-side at 50% 50%,#000 92%,transparent 100%);
}
.scene::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:linear-gradient(to bottom,transparent 55%,rgba(23,29,25,.45) 65%,#171d19 77%);
}
</style>
<main>
<h1>IMGP0627 · Parallax draft</h1>
<div class="scene" role="img" aria-label="A seated musician playing guitar on a porch, separated into three depth layers.">
<img class="foliage" src="01-foliage.png" alt="">
<img class="porch" src="02-porch.png" alt="">
<img class="musician" src="03-musician.png" alt="">
</div>
<button type="button" aria-pressed="false">Pause motion</button>
<p>A gentle float runs continuously. Move your pointer over the photo to add more depth. Reduced motion preferences are respected.</p>
<p>AI-edited draft: hidden scenery and subject details have been reconstructed. <a href="clean-plate.png">View clean background plate</a>.</p>
</main>
<script>
const scene=document.querySelector('.scene'),layers=[...scene.querySelectorAll('img')],button=document.querySelector('button'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches,pointer=false,targetX=0,targetY=0,x=0,y=0,frame,previousTime=0,elapsed=0;
function label(){button.textContent=paused?'Play motion':'Pause motion';button.setAttribute('aria-pressed',String(paused))}
label();
scene.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=scene.getBoundingClientRect();pointer=true;targetX=(e.clientX-r.left)/r.width*2-1;targetY=(e.clientY-r.top)/r.height*2-1});
scene.addEventListener('pointerleave',()=>{pointer=false});
function tick(time){
  const dt=previousTime?Math.min((time-previousTime)/1000,.05):1/60;
  previousTime=time;
  if(!paused)elapsed+=dt;
  // Ambient drift stays active underneath the pointer contribution.
  const driftX=Math.sin(elapsed*.55)*.48+Math.sin(elapsed*.23)*.16;
  const driftY=Math.sin(elapsed*.43)*.5+Math.sin(elapsed*.71)*.12;
  const tx=paused?0:driftX+(pointer?targetX*1.3:0);
  const ty=paused?0:driftY+(pointer?targetY*1.05:0);
  const ease=1-Math.exp(-dt*4);
  x+=(tx-x)*ease;y+=(ty-y)*ease;
  const s=scene.clientWidth/460;
  [-5,1,6].forEach((depth,i)=>{
    layers[i].style.transform=`translate(${x*depth*s}px,${y*depth*.65*s}px) rotate(${x*depth*.018}deg)`;
  });
  if(!paused||Math.abs(x)+Math.abs(y)>.001)frame=requestAnimationFrame(tick);
  else{frame=undefined;previousTime=0}
}
function start(){if(frame===undefined){previousTime=0;frame=requestAnimationFrame(tick)}}
button.addEventListener('click',()=>{paused=!paused;label();start()});reduced.addEventListener('change',e=>{paused=e.matches;label();start()});start();
</script>
</html>
